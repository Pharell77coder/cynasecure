services:
  # Pas de service "db" ici : la base Postgres est hébergée sur Supabase (voir DATABASE_URL dans backend/.env).
  # Adminer sert juste d'interface web pour aller la consulter/modifier depuis Docker.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: aws-0-eu-central-1.pooler.supabase.com  # à remplacer par ton host Supabase (voir plus bas)

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env.local
    # Pas d'override de DATABASE_URL ici : celle du .env (Supabase) est utilisée directement,
    # en local comme une fois déployé.
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "5174:5174"
    volumes:
      - ./backoffice:/app
      - /app/node_modules
    depends_on:
      - backend

  mobile:
    build: ./mobile
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "8081:8081"
    volumes:
      - ./mobile:/app
      - /app/node_modules
    stdin_open: true
    tty: true
