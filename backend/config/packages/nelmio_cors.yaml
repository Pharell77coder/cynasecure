nelmio_cors:
    defaults:
        origin_regex: true
        allow_origin: 
            - 'http://localhost:3000'
            - 'http://localhost:3001'
            - 'http://localhost:8081'
            - 'http://192.168.56.1:8081'
        allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
        allow_headers: ['Content-Type', 'Authorization']
        expose_headers: ['Link']
        max_age: 3600
    paths:
        '^/': null